# Render Blueprint Configuration for SkillSwap
# https://render.com/docs/blueprint-spec
services:
  # 1. Backend Web Service
  - type: web
    name: skillswap-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d

  # 2. Frontend Static Site
  - type: web
    name: skillswap-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skillswap-backend
          property: host
          path: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
